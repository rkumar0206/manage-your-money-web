<header
  class="sticky top-0 z-30 flex h-16 shrink-0 items-center justify-between gap-3 border-b border-white/60 bg-white/70 px-3 backdrop-blur-xl sm:px-4 lg:px-6"
>
  <!-- Left -->
  <div class="flex min-w-0 items-center gap-2">
    <!-- Desktop: sidebar toggle -->
    <button
      type="button"
      (click)="toggleSidebar.emit()"
      class="hidden h-10 w-10 items-center justify-center rounded-xl text-slate-500 transition-all duration-200 hover:bg-slate-100/80 hover:text-slate-900 active:scale-95 md:inline-flex"
      [attr.aria-label]="sidebarCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      @if (sidebarCollapsed()) {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5 15.75 12l-7.5 7.5" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
        </svg>
      }
    </button>

    <!-- Mobile: brand -->
    <div class="flex items-center gap-2 md:hidden">
      <div
        class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 text-white shadow-md shadow-indigo-500/30"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke-width="1.8" stroke="currentColor" class="h-4 w-4">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M21 12a2.25 2.25 0 0 0-2.25-2.25H15a3 3 0 1 1-6 0H5.25A2.25 2.25 0 0 0 3 12m18 0v6a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 18v-6m18 0V9M3 12V9m18 0a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 9m18 0V6a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 6v3" />
        </svg>
      </div>
      <span class="truncate text-sm font-bold text-slate-900">Manage-Your-Money</span>
    </div>
  </div>

  <!-- Right -->
  <div class="relative flex items-center gap-2" data-user-menu>
    <button
      type="button"
      (click)="toggleMenu()"
      class="flex items-center gap-2 rounded-xl border border-transparent p-1 pr-2 transition-all duration-200 hover:border-slate-200 hover:bg-white/80 active:scale-[0.98]"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuOpen()"
    >
      <span
        class="flex h-8 w-8 items-center justify-center rounded-full bg-gradient-to-br from-indigo-500 to-fuchsia-500 text-xs font-semibold text-white shadow-md shadow-indigo-500/30"
      >
        MY
      </span>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke-width="2" stroke="currentColor"
           class="h-4 w-4 text-slate-400 transition-transform duration-200"
           [class.rotate-180]="menuOpen()">
        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
      </svg>
    </button>

    @if (menuOpen()) {
      <div
        role="menu"
        class="absolute right-0 top-full mt-2 w-56 origin-top-right overflow-hidden rounded-2xl border border-white/60 bg-white/80 p-1.5 shadow-xl shadow-indigo-500/10 backdrop-blur-xl animate-menu-in"
      >
        <div class="px-3 py-2">
          <p class="text-sm font-semibold text-slate-900">Signed in</p>
          <p class="truncate text-xs text-slate-500">Welcome back</p>
        </div>
        <div class="my-1 h-px bg-slate-200/70"></div>
        <button
          type="button"
          role="menuitem"
          (click)="onLogout()"
          class="flex w-full items-center gap-2.5 rounded-xl px-3 py-2 text-left text-sm font-medium text-red-600 transition-colors duration-150 hover:bg-red-50"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
               stroke-width="1.8" stroke="currentColor" class="h-4 w-4">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
          </svg>
          Log out
        </button>
      </div>
    }
  </div>
</header>
