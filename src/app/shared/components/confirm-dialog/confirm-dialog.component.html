<div
  class="fixed inset-0 z-50 flex items-end justify-center bg-slate-900/40 p-4 backdrop-blur-sm animate-dialog-backdrop sm:items-center"
  (click)="onBackdropClick($event)"
  role="dialog"
  aria-modal="true"
  aria-labelledby="confirm-dialog-title"
>
  <div
    class="w-full max-w-md overflow-hidden rounded-2xl border border-white/60 bg-white/95 shadow-2xl shadow-slate-900/20 backdrop-blur-xl animate-dialog-panel"
  >
    <div class="p-5 sm:p-6">
      <!-- Icon + Title -->
      <div class="flex items-start gap-4">
        <div
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl"
          [class]="variant() === 'danger' ? 'bg-red-100 text-red-600' : 'bg-indigo-100 text-indigo-600'"
        >
          @if (variant() === 'danger') {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                 stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                 stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z" />
            </svg>
          }
        </div>

        <div class="min-w-0 flex-1">
          <h2 id="confirm-dialog-title" class="text-base font-semibold text-slate-900 sm:text-lg">
            {{ title() }}
          </h2>
          @if (message()) {
            <p class="mt-1.5 text-sm text-slate-500">{{ message() }}</p>
          }
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex flex-col-reverse gap-2 border-t border-slate-200/70 bg-slate-50/60 p-4 sm:flex-row sm:justify-end sm:gap-3 sm:px-6">
      <button
        type="button"
        (click)="onCancel()"
        [disabled]="isLoading()"
        class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-600 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-slate-300 hover:text-slate-900 hover:shadow-md disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:translate-y-0"
      >
        {{ cancelText() }}
      </button>

      <button
        #confirmBtn
        type="button"
        (click)="onConfirm()"
        [disabled]="isLoading()"
        [class]="confirmButtonClasses()"
      >
        @if (isLoading()) {
          <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity="0.25" stroke-width="4" />
            <path d="M22 12a10 10 0 0 1-10 10" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
          </svg>
        }
        <span>{{ confirmText() }}</span>
      </button>
    </div>
  </div>
</div>
