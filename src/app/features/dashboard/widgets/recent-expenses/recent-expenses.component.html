<app-dashboard-card
  title="Recent activity"
  subtitle="Your latest 5 expenses"
  [loading]="isLoading()"
  [error]="errorMessage()"
  [isEmpty]="!isLoading() && !errorMessage() && expenses().length === 0"
  emptyMessage="No expenses yet."
  minHeight="200px"
  (retry)="reload()"
>
  <ul class="divide-y divide-slate-200/70">
    @for (e of expenses(); track e.id) {
      <li>
        <a
          [routerLink]="['/expenses', e.id, 'edit']"
          class="group flex items-center gap-3 py-2.5 transition-colors duration-150 hover:bg-slate-50/60"
        >
              <span
                class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-100 via-slate-50 to-fuchsia-100 text-indigo-500"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.8"
                  stroke="currentColor"
                  class="h-4 w-4"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                  />
                </svg>
              </span>
          <span class="min-w-0 flex-1">
                <span class="block truncate text-sm font-medium text-slate-900">
                  {{ e.spentOn || e.categoryName || 'Untitled expense' }}
                </span>
                <span class="mt-0.5 block text-[11px] text-slate-500">
                  {{ e.categoryName || 'Uncategorized' }} · {{ formatDate(e.created) }}
                </span>
              </span>
          <span class="shrink-0 text-sm font-bold tabular-nums text-slate-900">
                {{ formatCurrency(e.amount) }}
              </span>
        </a>
      </li>
    }
  </ul>

  <div class="mt-3 border-t border-slate-200/70 pt-3 text-right">
    <a
      routerLink="/expenses"
      class="inline-flex items-center gap-1 text-xs font-semibold text-indigo-600 transition-colors hover:text-indigo-500"
    >
      View all
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        class="h-3 w-3"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"
        />
      </svg>
    </a>
  </div>
</app-dashboard-card>
