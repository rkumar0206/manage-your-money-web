@if (isLoading() && !summary()) {
  <div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
    @for (i of [1, 2, 3, 4]; track i) {
      <div
        class="h-28 animate-pulse rounded-2xl border border-white/60 bg-white/70 shadow-lg shadow-indigo-500/5 backdrop-blur-xl"
      ></div>
    }
  </div>
} @else if (errorMessage()) {
  <div class="rounded-2xl border border-red-200 bg-red-50/70 p-5 text-center backdrop-blur-xl">
    <p class="text-sm text-red-700">{{ errorMessage() }}</p>
    <button
      type="button"
      (click)="reload()"
      class="mt-3 rounded-lg border border-red-200 bg-white/80 px-3 py-1.5 text-xs font-semibold text-red-700 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md"
    >
      Retry
    </button>
  </div>
} @else {
  <div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
    @for (kpi of kpis(); track kpi.label) {
      <div
        class="relative flex flex-col gap-3 overflow-hidden rounded-2xl border border-white/60 bg-white/80 p-4 shadow-lg shadow-indigo-500/5 backdrop-blur-xl transition-all duration-300 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-indigo-500/10 sm:p-5"
      >
        <div class="flex items-center justify-between gap-2">
          <p class="text-[10px] font-semibold uppercase tracking-widest text-slate-400">
            {{ kpi.label }}
          </p>
          <span
            class="flex h-7 w-7 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-500 to-fuchsia-500 text-white shadow-md shadow-indigo-500/30"
          >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.8"
                  stroke="currentColor"
                  class="h-3.5 w-3.5"
                >
                  <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="kpi.iconPath" />
                </svg>
              </span>
        </div>
        <p class="text-xl font-bold tabular-nums tracking-tight text-slate-900 sm:text-2xl">
          {{ kpi.value }}
        </p>
        <p class="text-[11px] text-slate-500">{{ kpi.hint }}</p>
        <span
          class="pointer-events-none absolute inset-x-0 bottom-0 h-1 origin-left scale-x-0 bg-gradient-to-r from-indigo-500 to-fuchsia-500 transition-transform duration-300 group-hover:scale-x-100"
        ></span>
      </div>
    }
  </div>
}
