<app-dashboard-card
  title="Daily spending heatmap"
  [subtitle]="'Every day of ' + year()"
  [loading]="isLoading() && !data()"
  [error]="errorMessage()"
  [isEmpty]="!isLoading() && !errorMessage() && (!data() || data()!.days.length === 0)"
  emptyMessage="No data for this year."
  (retry)="reload()"
>
  <!-- Legend -->
  <div class="mb-4 flex items-center justify-end gap-1.5 text-[10px] text-slate-500">
    <span>Less</span>
    @for (lvl of [0, 1, 2, 3, 4]; track lvl) {
      <span class="h-3 w-3 rounded-sm" [class]="levelClass(lvl)"></span>
    }
    <span>More</span>
  </div>

  <!-- Month grids -->
  <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
    @for (m of months(); track m.monthIndex) {
      <div>
        <p class="mb-1.5 text-[10px] font-semibold uppercase tracking-wider text-slate-400">
          {{ m.monthName }}
        </p>
        <div class="grid grid-cols-7 gap-0.5">
          @for (c of m.cells; track c.date) {
            <span
              [class]="
                    'aspect-square rounded-sm ' +
                    (c.inMonth ? levelClass(c.level) : 'bg-transparent')
                  "
              [attr.title]="c.inMonth ? c.date + ' · ' + formatCurrency(c.amount) : null"
            ></span>
          }
        </div>
      </div>
    }
  </div>
</app-dashboard-card>
