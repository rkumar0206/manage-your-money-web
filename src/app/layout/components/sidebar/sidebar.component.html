<aside
  class="sticky top-0 hidden h-[100dvh] shrink-0 flex-col overflow-hidden border-r border-white/60 bg-white/60 backdrop-blur-xl transition-[width] duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] md:flex"
  [style.width.px]="collapsed() ? 72 : 240"
>
  <!-- Brand -->
  <div class="flex h-16 shrink-0 items-center gap-3 border-b border-white/60 px-3">
    <div
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 text-white shadow-lg shadow-indigo-500/30 animate-pop-in"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M21 12a2.25 2.25 0 0 0-2.25-2.25H15a3 3 0 1 1-6 0H5.25A2.25 2.25 0 0 0 3 12m18 0v6a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 18v-6m18 0V9M3 12V9m18 0a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 9m18 0V6a2.25 2.25 0 0 0-2.25-2.25H5.25A2.25 2.25 0 0 0 3 6v3" />
      </svg>
    </div>
    <div
      class="overflow-hidden whitespace-nowrap transition-all duration-200"
      [class.w-0]="collapsed()"
      [class.opacity-0]="collapsed()"
    >
      <p class="truncate text-sm font-bold leading-tight text-slate-900">
        Manage-Your-Money
      </p>
      <p class="truncate text-[10px] font-medium uppercase tracking-wider text-slate-400">
        Finance Tracker
      </p>
    </div>
  </div>

  <!-- Nav -->
  <nav class="flex flex-1 flex-col overflow-y-auto px-2 py-4">
    <p
      class="mb-2 px-3 text-[10px] font-semibold uppercase tracking-widest text-slate-400 transition-opacity duration-200"
      [class.opacity-0]="collapsed()"
    >
      Money
    </p>

    <ul class="space-y-1">
      @for (item of mainItems(); track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="!text-white bg-gradient-to-r from-indigo-500 to-fuchsia-500 shadow-lg shadow-indigo-500/30"
            class="group relative flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition-all duration-200 hover:bg-slate-100/70 hover:text-slate-900"
          >
            <span class="shrink-0 transition-transform duration-200 group-hover:scale-110">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                   stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
                <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.iconPath" />
              </svg>
            </span>
            <span
              class="truncate whitespace-nowrap transition-all duration-200"
              [class.w-0]="collapsed()"
              [class.opacity-0]="collapsed()"
            >
              {{ item.label }}
            </span>
          </a>
        </li>
      }
    </ul>

    <div class="mt-auto">
      <p
        class="mb-2 mt-6 px-3 text-[10px] font-semibold uppercase tracking-widest text-slate-400 transition-opacity duration-200"
        [class.opacity-0]="collapsed()"
      >
        Account
      </p>
      <ul class="space-y-1">
        @for (item of accountItems(); track item.route) {
          <li>
            <a
              [routerLink]="item.route"
              routerLinkActive="!text-white bg-gradient-to-r from-indigo-500 to-fuchsia-500 shadow-lg shadow-indigo-500/30"
              class="group relative flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 transition-all duration-200 hover:bg-slate-100/70 hover:text-slate-900"
            >
              <span class="shrink-0 transition-transform duration-200 group-hover:scale-110">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                     stroke-width="1.8" stroke="currentColor" class="h-5 w-5">
                  <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.iconPath" />
                </svg>
              </span>
              <span
                class="truncate whitespace-nowrap transition-all duration-200"
                [class.w-0]="collapsed()"
                [class.opacity-0]="collapsed()"
              >
                {{ item.label }}
              </span>
            </a>
          </li>
        }
      </ul>
    </div>
  </nav>
</aside>
