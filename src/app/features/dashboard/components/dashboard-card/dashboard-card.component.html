<section
  class="relative flex flex-col rounded-2xl border border-white/60 bg-white/80 shadow-lg shadow-indigo-500/5 backdrop-blur-xl"
  [style.min-height]="minHeight() || null"
>
  @if (title() || subtitle()) {
    <header class="flex flex-wrap items-start justify-between gap-2 border-b border-slate-200/60 px-5 py-4">
      <div class="min-w-0">
        @if (title()) {
          <h2 class="truncate text-sm font-semibold text-slate-900 sm:text-base">
            {{ title() }}
          </h2>
        }
        @if (subtitle()) {
          <p class="mt-0.5 truncate text-xs text-slate-500">{{ subtitle() }}</p>
        }
      </div>
      <ng-content select="[card-actions]"></ng-content>
    </header>
  }

  <div class="relative flex-1 p-5">
    @if (loading()) {
      <div class="flex h-full min-h-[140px] items-center justify-center">
        <svg class="h-6 w-6 animate-spin text-indigo-500" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity="0.25" stroke-width="4" />
          <path d="M22 12a10 10 0 0 1-10 10" stroke="currentColor" stroke-width="4" stroke-linecap="round" />
        </svg>
      </div>
    } @else if (error()) {
      <div class="flex h-full min-h-[140px] flex-col items-center justify-center gap-3 text-center">
        <p class="text-xs text-red-600">{{ error() }}</p>
        <button
          type="button"
          (click)="retry.emit()"
          class="rounded-lg border border-slate-200 bg-white/80 px-3 py-1.5 text-[11px] font-semibold text-slate-600 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:border-slate-300 hover:shadow-md"
        >
          Retry
        </button>
      </div>
    } @else if (isEmpty()) {
      <div class="flex h-full min-h-[140px] items-center justify-center">
        <p class="text-xs text-slate-400">{{ emptyMessage() }}</p>
      </div>
    } @else {
      <ng-content></ng-content>
    }
  </div>
</section>
